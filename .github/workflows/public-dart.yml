name: Public DART data
on:
  workflow_dispatch:
    inputs:
      codes:
        description: '공개 수업 예제 종목코드 (쉼표 구분, 최대 10개)'
        default: '005930,000660'
        required: true
  push:
    paths:
      - '.github/workflows/public-dart.yml'
permissions:
  contents: write
concurrency:
  group: public-dart-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python collect_public_dart.py
        env:
          DART_CRTFC_KEY: ${{ secrets.DART_CRTFC_KEY }}
          PUBLIC_CODES: ${{ inputs.codes || '005930,000660' }}
      - name: Save public issuer data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public DART teaching examples'
            git pull --rebase origin main
            git push
          fi
